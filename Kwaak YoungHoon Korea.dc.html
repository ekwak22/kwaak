<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/classical-6c0fe2e1-130c-4491-a2cc-cfcc50cd3f00/styles.css">
<style>
  body { margin:0; }
  a { color: var(--color-accent); }
  a:hover { color: var(--color-accent-600); }
</style>
</helmet>
<div style="font-family:var(--font-body); background:var(--color-bg); color:var(--color-text);">

  <nav class="nav" style="background:var(--color-bg); flex-wrap:wrap; row-gap:8px;">
    <a href="index.dc.html" class="nav-brand" style="text-decoration:none;">{{ t.brand }}</a>
    <a href="index.dc.html">{{ t.homeLink }}</a>
    <a href="Kwaak YoungHoon Bio.dc.html">{{ t.personLink }}</a>
    <a href="Kwaak YoungHoon Korea.dc.html" style="opacity:0.5;">{{ t.koreaLink }}</a>
    <a href="Kwaak YoungHoon World.dc.html">{{ t.worldLink }}</a>
    <button onclick="{{ toggleLang }}" style="font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:14px; background:var(--color-bg); color:var(--color-accent); border:1px solid var(--color-accent); border-radius:var(--radius-md); padding:7px 16px; cursor:pointer;">{{ t.langButton }}</button>
  </nav>

  <!-- INTRO -->
  <section data-screen-label="Korea Intro" style="padding:var(--space-8) 8vw var(--space-6); border-bottom:1px solid var(--color-divider);">
    <div style="max-width:820px;">
      <h6 style="color:var(--color-accent);">{{ t.intro.kicker }}</h6>
      <h1 style="font-size:clamp(36px,5vw,58px); margin:var(--space-2) 0 var(--space-4);">{{ t.intro.heading }}</h1>
      <p style="font-size:18px; line-height:1.75; text-align:justify; opacity:0.85;">{{ t.intro.paragraph }}</p>
    </div>
  </section>

  <!-- PROJECTS -->
  <sc-for list="{{ t.projects }}" as="proj" hint-placeholder-count="11">
    <section style="padding:0 8vw; {{ proj.borderStyle }}">
      <div style="max-width:800px; margin:0 auto; padding-bottom:var(--space-8);">
        <div style="font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:16px; color:var(--color-accent); margin-bottom:var(--space-1);">{{ proj.year }}</div>
        <h3 style="margin:0 0 var(--space-2); font-size:26px;">{{ proj.title }}</h3>
        <p style="font-size:16px; line-height:1.75; text-align:justify; margin:0; opacity:0.85;">{{ proj.description }}</p>
      </div>
    </section>
  </sc-for>

  <!-- FOOTER -->
  <footer style="padding:var(--space-6) 8vw; background:var(--color-surface); border-top:1px solid var(--color-divider);">
    <div style="max-width:1200px; margin:0 auto; font-size:12px; opacity:0.55;">{{ t.footer }}</div>
  </footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang: 'en' };

  content = {
    en: {
      brand: 'KWAAK YoungHoon',
      homeLink: '← Home',
      personLink: 'Person',
      koreaLink: 'Korea',
      worldLink: 'World',
      langButton: '한국어',
      intro: {
        kicker: 'Korea — City & National Scale',
        heading: 'Building the nation, project by project',
        paragraph: 'From the master visions he sketched in the 1970s (M.V.I.P. I–III), KWAAK YoungHoon helped shape the mega-events, streets, parks, and infrastructure that define the capital region and the nation at large — work carried out across eight presidential administrations without ever holding formal office.',
      },
      projectsRaw: [
        { year: '1988', title: 'Seoul Olympic Games', description: 'Under his 1971 Master Vision and Implementation Plan, KWAAK YoungHoon helped conceive the infrastructure and civic vision behind Korea\u2019s Olympic debut on the world stage.' },
        { year: '1993', title: 'Daejeon Expo', description: 'Korea\u2019s first World Expo, conceptualized as a bold leap into the future — showcasing the country\u2019s technological ambitions and cementing Daejeon\u2019s role as a hub of science and research.' },
        { year: '2002', title: 'FIFA World Cup', description: 'One of the Global Mega Events envisioned in his early master plans, co-hosted with Japan and marking another milestone in Korea\u2019s emergence on the world stage.' },
        { year: '2012', title: 'Yeosu Expo', description: 'Fifty years after first falling for the port city, he helped bring the World Expo to Yeosu — a path toward balance and harmony between land and sea, and between Korea\u2019s regions.' },
        { year: '2018', title: 'PyeongChang Winter Olympics', description: 'The triumph of a decades-long dream, as PyeongChang hosted the Winter Games and completed Korea\u2019s run as a nation that has staged both Summer and Winter Olympics, two World Expos, and a World Cup.' },
        { year: 'Han River', title: 'Han River Park', description: 'He shaped the story behind the modern Han River landscape, turning the riverfront into the continuous public park that now defines Seoul\u2019s skyline, weekend life, and civic identity.' },
        { year: 'University Street', title: 'Daehak-ro (University Street)', description: 'He conceived Daehak-ro as a street of art and eternal romance — still one of Seoul\u2019s most beloved theater and culture districts, decades after its creation.' },
        { year: 'Line 2', title: 'Seoul Subway Line 2', description: 'He worked on the routing and civic vision behind the circular Line 2, which remains the backbone of Seoul\u2019s metro system and one of the busiest subway lines in the world.' },
        { year: 'Incheon', title: 'Incheon International Airport', description: 'A project nearly everyone opposed at the outset, Incheon Airport is now one of the world\u2019s leading international gateways and a symbol of Korea\u2019s global connectivity.' },
        { year: 'Cheonggyecheon', title: 'Cheonggyecheon Restoration', description: 'He contributed to the vision that brought the long-buried Cheonggyecheon stream back to life through the heart of Seoul, replacing an elevated highway with a public waterway.' },
        { year: 'KTX', title: 'KTX High-Speed Rail', description: 'He helped shape the transportation infrastructure vision behind Korea\u2019s high-speed rail network, transforming how people move between the country\u2019s major cities.' },
      ],
      footer: '\u00A9 KWAAK YoungHoon. Project details drawn from his published works and public record.',
    },
    ko: {
      brand: '곽영훈',
      homeLink: '← 홈으로',
      personLink: '인물',
      koreaLink: '대한민국',
      worldLink: '세계',
      langButton: 'English',
      intro: {
        kicker: '대한민국 — 도시·국가 차원',
        heading: '국가를 지어온 프로젝트들',
        paragraph: '1970년대에 구상한 마스터 비전(M.V.I.P. I~III)을 바탕으로, 곽영훈 박사는 수도권과 국가 전체를 정의하는 메가 이벤트, 거리, 공원, 인프라를 만드는 일에 참여했다 — 공식 관직을 맡은 적 없이 여덟 정권에 걸쳐 이어온 일이다.',
      },
      projectsRaw: [
        { year: '1988', title: '서울올림픽', description: '1971년 마스터 비전(M.V.I.P.)을 바탕으로 곽영훈 박사는 한국의 올림픽 데뷔를 뒷받침하는 인프라와 시민적 비전 설계에 참여했다.' },
        { year: '1993', title: '대전엑스포', description: '한국 최초의 세계박람회로, 미래를 향한 대담한 도약으로 기획되었다 — 한국의 기술적 야망을 보여주고 대전을 과학·연구의 중심지로 자리매김했다.' },
        { year: '2002', title: '한일 월드컵', description: '초기 마스터 플랜에서 구상한 글로벌 메가 이벤트 중 하나로, 일본과 공동 개최하며 한국이 세계 무대에 등장하는 또 하나의 이정표가 되었다.' },
        { year: '2012', title: '여수엑스포', description: '이 항구도시와 처음 인연을 맺은 지 50년 만에, 그는 여수세계박람회를 이끌어냈다 — 육지와 바다, 그리고 한국 각 지역 간 균형과 화합을 향한 길이었다.' },
        { year: '2018', title: '평창동계올림픽', description: '수십 년에 걸친 꿈이 결실을 맺은 순간으로, 평창 동계올림픽 개최와 함께 한국은 하계·동계 올림픽, 두 번의 세계박람회, 그리고 월드컵까지 모두 개최한 나라가 되었다.' },
        { year: '한강', title: '한강공원', description: '오늘날 한강의 풍경이 탄생한 배경에는 그가 있다 — 강변을 서울의 스카이라인과 주말 문화, 시민 정체성을 정의하는 연속된 공공 공원으로 바꾸었다.' },
        { year: '대학로', title: '대학로', description: '대학로를 예술과 영원한 낭만의 거리로 구상했다 — 조성된 지 수십 년이 지난 지금도 서울에서 가장 사랑받는 공연·문화 지구 중 하나다.' },
        { year: '2호선', title: '서울 지하철 2호선', description: '오늘날 서울 대중교통의 근간이자 세계에서 가장 붐비는 지하철 노선 중 하나인 순환선 2호선의 노선과 시민적 비전 설계에 참여했다.' },
        { year: '인천', title: '인천국제공항', description: '처음엔 거의 모두가 반대했던 프로젝트였지만, 인천국제공항은 지금 세계 최고 수준의 관문이자 한국의 글로벌 연결성을 상징하는 존재가 되었다.' },
        { year: '청계천', title: '청계천 복원', description: '오랫동안 묻혀 있던 청계천을 서울 도심 한가운데 되살린 비전에 기여했다 — 고가도로 대신 시민을 위한 물길을 되찾았다.' },
        { year: 'KTX', title: 'KTX 고속철도', description: '한국 고속철도망을 뒷받침하는 교통 인프라 비전 설계에 참여하여, 주요 도시 간 이동 방식을 근본적으로 바꾸어놓았다.' },
      ],
      footer: '© 곽영훈. 프로젝트 상세 내용은 발간 저서 및 공개 자료를 바탕으로 합니다.',
    },
  };

  buildProjects(t) {
    return t.projectsRaw.map((p, i) => ({ ...p, borderStyle: i === t.projectsRaw.length - 1 ? 'border-bottom:1px solid var(--color-divider);' : '' }));
  }

  renderVals() {
    const lang = this.state.lang;
    if (!this._cache) this._cache = {};
    if (!this._cache[lang]) {
      const t = this.content[lang];
      this._cache[lang] = { ...t, projects: this.buildProjects(t) };
    }
    return {
      t: this._cache[lang],
      toggleLang: () => this.setState(s => ({ lang: s.lang === 'en' ? 'ko' : 'en' })),
    };
  }
}
</script>
</body>
</html>
