<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/classical-6c0fe2e1-130c-4491-a2cc-cfcc50cd3f00/styles.css">
<style>
  body { margin:0; }
  a { color: var(--color-accent); }
  a:hover { color: var(--color-accent-600); }
</style>
</helmet>
<div style="font-family:var(--font-body); background:var(--color-bg); color:var(--color-text);">

  <nav class="nav" style="background:var(--color-bg); flex-wrap:wrap; row-gap:8px;">
    <a href="index.dc.html" class="nav-brand" style="text-decoration:none;">{{ t.brand }}</a>
    <a href="index.dc.html">{{ t.homeLink }}</a>
    <a href="Kwaak YoungHoon Bio.dc.html">{{ t.personLink }}</a>
    <a href="Kwaak YoungHoon Korea.dc.html">{{ t.koreaLink }}</a>
    <a href="Kwaak YoungHoon World.dc.html" style="opacity:0.5;">{{ t.worldLink }}</a>
    <button onclick="{{ toggleLang }}" style="font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:14px; background:var(--color-bg); color:var(--color-accent); border:1px solid var(--color-accent); border-radius:var(--radius-md); padding:7px 16px; cursor:pointer;">{{ t.langButton }}</button>
  </nav>

  <!-- INTRO -->
  <section data-screen-label="World Intro" style="padding:var(--space-8) 8vw var(--space-6); border-bottom:1px solid var(--color-divider);">
    <div style="max-width:820px;">
      <h6 style="color:var(--color-accent);">{{ t.intro.kicker }}</h6>
      <h1 style="font-size:clamp(36px,5vw,58px); margin:var(--space-2) 0 var(--space-4);">{{ t.intro.heading }}</h1>
      <p style="font-size:18px; line-height:1.75; text-align:justify; opacity:0.85;">{{ t.intro.paragraph }}</p>
    </div>
  </section>

  <!-- PROJECTS -->
  <sc-for list="{{ t.projects }}" as="proj" hint-placeholder-count="4">
    <section style="padding:0 8vw; {{ proj.borderStyle }}">
      <div style="max-width:800px; margin:0 auto; padding-bottom:var(--space-8);">
        <div style="font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:16px; color:var(--color-accent); margin-bottom:var(--space-1);">{{ proj.year }}</div>
        <h3 style="margin:0 0 var(--space-2); font-size:26px;">{{ proj.title }}</h3>
        <p style="font-size:16px; line-height:1.75; text-align:justify; margin:0; opacity:0.85;">{{ proj.description }}</p>
      </div>
    </section>
  </sc-for>

  <!-- FOOTER -->
  <footer style="padding:var(--space-6) 8vw; background:var(--color-surface); border-top:1px solid var(--color-divider);">
    <div style="max-width:1200px; margin:0 auto; font-size:12px; opacity:0.55;">{{ t.footer }}</div>
  </footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang: 'en' };

  content = {
    en: {
      brand: 'KWAAK YoungHoon',
      homeLink: '← Home',
      personLink: 'Person',
      koreaLink: 'Korea',
      worldLink: 'World',
      langButton: '한국어',
      intro: {
        kicker: 'World — International & Global Scale',
        heading: 'Building peace across borders',
        paragraph: 'Beyond Korea\u2019s borders, KWAAK YoungHoon has worked on cross-border development and peace planning across Northeast Asia — extending city-to-city diplomacy along the historic Silk Road and rallying world leaders around the idea that global gatherings can be a force for peace.',
      },
      projectsRaw: [
        { year: 'DMZ', title: 'DMZ Peace City Vision', description: 'The teenage promise he made with his brother in 1958 — a peace city near the DMZ where North and South Korea could live in harmony — has guided decades of planning for the border region as a starting point for peace.' },
        { year: '1990', title: 'Tumen River Area Development Plan', description: 'As Korea\u2019s representative and a UNDP senior consultant, he worked on the Tumen River Area Development Plan (T.R.A.D.P.), part of his wider Northeast Asia Region Accord vision for cooperation among Korea, China, Russia, and Mongolia.' },
        { year: '2004', title: 'Silk Road Mayors Forum (Yeosu SRMF)', description: 'He founded the Silk Road Mayors Forum to connect city leaders along the historic Silk Road, extending his vision of city-to-city diplomacy across Eurasia.' },
        { year: '1987–88', title: 'WCO Olympeace Movement', description: 'Through the Seoul Assembly of Olympeace and his Appeal for Olympeace, he rallied world leaders around the idea that the Olympic Games could be a force for peace rather than boycott — a movement that continues through the World Citizens Organization today.' },
      ],
      footer: '\u00A9 KWAAK YoungHoon. Project details drawn from his published works and public record.',
    },
    ko: {
      brand: '곽영훈',
      homeLink: '← 홈으로',
      personLink: '인물',
      koreaLink: '대한민국',
      worldLink: '세계',
      langButton: 'English',
      intro: {
        kicker: '세계 — 국제·지구촌 차원',
        heading: '국경을 넘어 평화를 짓다',
        paragraph: '한국을 넘어, 곽영훈 박사는 동북아시아 전역의 초국경 개발과 평화 기획에 참여해왔다 — 실크로드를 따라 도시 간 외교를 확장하고, 세계적 행사가 평화의 힘이 될 수 있다는 생각으로 세계 지도자들을 결집시켰다.',
      },
      projectsRaw: [
        { year: 'DMZ', title: 'DMZ 평화도시 구상', description: '1958년 형과 함께 세운 십 대 시절의 다짐 — 남북이 화합하며 살 수 있는 DMZ 인근 평화도시 — 은 이후 수십 년간 접경 지역을 평화의 출발점으로 만드는 계획의 밑그림이 되었다.' },
        { year: '1990', title: '두만강 유역 개발계획', description: '한국 대표이자 UNDP 선임 자문위원으로서 두만강유역개발계획(T.R.A.D.P.)에 참여했으며, 이는 한·중·러·몽골 협력을 아우르는 동북아지역협정(N.E.A.R.A.) 비전의 일부였다.' },
        { year: '2004', title: '실크로드 시장포럼(여수 SRMF)', description: '실크로드를 따라 도시 지도자들을 연결하는 실크로드 시장포럼을 창설하여, 도시 간 외교라는 그의 비전을 유라시아 전역으로 확장했다.' },
        { year: '1987–88', title: 'WCO 올림피스 운동', description: '서울올림픽 평화위원회(SAO)와 올림피스 호소문을 통해, 그는 올림픽이 보이콧이 아닌 평화의 힘이 될 수 있다는 생각으로 세계 지도자들을 결집시켰다 — 이 운동은 오늘날에도 세계시민기구를 통해 이어지고 있다.' },
      ],
      footer: '© 곽영훈. 프로젝트 상세 내용은 발간 저서 및 공개 자료를 바탕으로 합니다.',
    },
  };

  buildProjects(t) {
    return t.projectsRaw.map((p, i) => ({ ...p, borderStyle: i === t.projectsRaw.length - 1 ? 'border-bottom:1px solid var(--color-divider);' : '' }));
  }

  renderVals() {
    const lang = this.state.lang;
    if (!this._cache) this._cache = {};
    if (!this._cache[lang]) {
      const t = this.content[lang];
      this._cache[lang] = { ...t, projects: this.buildProjects(t) };
    }
    return {
      t: this._cache[lang],
      toggleLang: () => this.setState(s => ({ lang: s.lang === 'en' ? 'ko' : 'en' })),
    };
  }
}
</script>
</body>
</html>
